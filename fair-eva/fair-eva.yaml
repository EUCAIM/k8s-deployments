apiVersion: apps/v1
kind: Deployment
metadata:
  name: fair-eva-web-service
  namespace: catalogue
  labels:
    app: fair-eva-web-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fair-eva-web-service
  template:
    metadata:
      labels:
        app: fair-eva-web-service
    spec:
      containers:
      - name: fair-eva-web-service
        image: harbor.eucaim.cancerimage.eu/processing-tools/fair_eva_service:0.4.2
        ports:
        - containerPort: 9090
      imagePullSecrets:
        - name: regcred

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fair-eva-web-client
  namespace: catalogue
  labels:
    app: fair-eva-web-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fair-eva-web-client
  template:
    metadata:
      labels:
        app: fair-eva-web-client
    spec:
      containers:
      - name: fair-eva-web-client
        image: harbor.eucaim.cancerimage.eu/processing-tools/fair_eva_web:0.4.2
        args: 
          - "--api-endpoint"
          - "http://fair-eva-service/v1.0/rda/rda_all"
        ports:
        - containerPort: 5000
      imagePullSecrets:
        - name: regcred

---

apiVersion: v1
kind: Service
metadata:
  name: fair-eva-web
  namespace: catalogue
spec:
  type: ClusterIP
  selector:
    app: fair-eva-web-client
  ports:
  - name: fair-eva-web-client
    protocol: TCP
    port: 80
    targetPort: 5000

---

apiVersion: v1
kind: Service
metadata:
  name: fair-eva-service
  namespace: catalogue
spec:
  type: ClusterIP
  selector:
    app: fair-eva-web-service
  ports:
  - name: fair-eva-web-service
    protocol: TCP
    port: 80
    targetPort: 9090

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fair-eva-ingress
  namespace: catalogue
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fair-eva.eucaim.cancerimage.eu
      secretName: fair-eva-tls
  rules:
    - host: fair-eva.eucaim.cancerimage.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fair-eva-web
                port:
                  number: 80
