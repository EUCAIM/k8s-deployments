kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: explorer-ingress
  namespace: federated-search
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$escaped_request_uri"
spec:
  tls:
    - hosts:
        - explorer-eucaim.grycap.i3m.upv.es
      secretName: explorer-eucaim.grycap.i3m.upv.es
  rules:
    - host: explorer-eucaim.grycap.i3m.upv.es
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lens-service
                port:
                  number: 80

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lens-deployment
  namespace: federated-search
  labels:
    app: lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lens
  template:
    metadata:
      namespace: federated-search
      labels:
        app: lens
    spec:
      containers:
      - name: lens
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits: 
            cpu: 1
            memory: 2Gi
        imagePullPolicy: Always
        image: docker.verbis.dkfz.de/cache/samply/eucaim-frontend:eucaim-datamodel

---

apiVersion: v1
kind: Service
metadata:
  name: lens-service
  namespace: federated-search
  labels:
    app: lens
spec:
  selector:
    app: lens
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      
---
