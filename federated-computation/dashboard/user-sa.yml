
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-user-dashboard
  namespace: fedcomp-users
annotations:
  description: The user that has access to the namespace and can edit the resources
#automountServiceAccountToken: false

---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sa-user-dashboard
  namespace: fedcomp
annotations:
  description: Rigths for the user's SA
rules:
  - apiGroups:
        - ""
        - apps
    resources: ["pods", "pods/log", "pods/status", "pods/exec", "configmaps", "deployments", "deployments/scale", "deployments/status", "services", "services/status", "secrets", "replicasets"]
    verbs: ["create", "get", "list", "watch",  "delete", "update", "patch"]

---

kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sa-user-dashboard
  namespace: fedcomp
annotations:
  description: Binds the role for the user SA to the actual role
subjects:
  - kind: ServiceAccount
    name: sa-user-dashboard
    namespace: fedcomp-users
roleRef:
  kind: Role
  name: sa-user-dashboard
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: Secret
metadata:
  name: sa-user-dashboard-token
  namespace: fedcomp-users
  annotations:
    kubernetes.io/service-account.name: sa-user-dashboard
annotations:
  description: Predefined token for the user SA
type: kubernetes.io/service-account-token

