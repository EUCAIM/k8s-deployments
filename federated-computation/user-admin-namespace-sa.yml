
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-user-admin-namespace
  namespace: fedcomp-users
annotations:
  description: The user that has access to the namespace fedcomp and fedcomp-users and can edit the resources

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sa-user-admin-namespace
  namespace: fedcomp-users
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sa-user-admin-namespace
  namespace: fedcomp
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sa-user-admin-namespace
  namespace: fedcomp
subjects:
  - kind: ServiceAccount
    name: sa-user-admin-namespace
    namespace: fedcomp-users
roleRef:
  kind: Role
  name: sa-user-admin-namespace
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sa-user-admin-namespace
  namespace: fedcomp-users
subjects:
  - kind: ServiceAccount
    name: sa-user-admin-namespace
    namespace: fedcomp-users
roleRef:
  kind: Role
  name: sa-user-admin-namespace
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: Secret
metadata:
  name: sa-user-admin-namespace-token
  namespace: fedcomp-users
  annotations:
    kubernetes.io/service-account.name: sa-user-admin-namespace
annotations:
  description: Predefined token for the user SA
type: kubernetes.io/service-account-token
