apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-user-<name>
  namespace: fedcomp-users
annotations:
  description: The user that has access to the namespace and can edit the resources
#automountServiceAccountToken: false
---

apiVersion: v1
kind: Secret
metadata:
  name: sa-user-<name>-token
  namespace: fedcomp-users
  annotations:
    kubernetes.io/service-account.name: sa-user-<name>
annotations:
  description: Predefined token for the user SA
type: kubernetes.io/service-account-token

---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sa-user-<name>
  namespace: fedcomp
annotations:
  description: Rigths for the user's SA
rules:
  - apiGroups:
        - ""
        - apps
    resources: ["persistentvolumeclaims", "secrets", "pods", "events", "pods/log", "pods/status", "pods/exec", "configmaps", "deployments", "deployments/scale", "deployments/status", "services", "services/status", "replicasets"]
    verbs: ["create", "get", "list", "watch",  "delete", "update", "patch"]

---

kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sa-user-<name>
  namespace: fedcomp
annotations:
  description: Binds the role for the user SA to the actual role
subjects:
  - kind: ServiceAccount
    name: sa-user-<name>
    namespace: fedcomp-users
roleRef:
  kind: Role
  name: sa-user-<name>
  apiGroup: rbac.authorization.k8s.io


